# GenomIO Configuration File
# Configuration for genomic gap filling using LLMs

# Model Configuration
models:
  dnabert2:
    name: "zhihan1996/DNABERT-2-117M"
    max_length: 512
    mask_token: "[MASK]"
    
  grover:
    name: "grover-base"
    max_length: 1024
    
  gena_lm:
    name: "AIRI-Institute/gena-lm-bigbird-base-t2t"
    max_length: 4096
    mask_token: "[MASK]"
    
  nucleotide_transformer:
    name: "InstaDeepAI/nucleotide-transformer-500m-1000g"
    max_length: 1000

# RAG Configuration
# Note: nothing reads this file yet, the values below are the ones hardcoded in
# src/rag/. It is kept in step so it stops describing a system that no longer exists.
rag:
  corpus_directory: "rag_corpus_uniform"
  embedding_model: "zhihan1996/DNABERT-S"
  vector_store: "faiss"
  index_type: "IndexHNSWFlat"   # M=32, efConstruction=200, efSearch=64
  index_cache: ".cache/rag_index"
  top_k_results: 3
  # No chunking. Every corpus record is already one CDS as annotated by NCBI, so a
  # record boundary is a biological boundary.

# Gap Filling Configuration
gap_filling:
  max_gap_size: 10000
  min_context_length: 500
  num_samples: 10
  temperature: 0.8
  top_p: 0.9
  
# Agent Configuration  
agents:
  planner:
    model: "gemini-pro"
    temperature: 0.1
    max_retries: 3
    
# Data Paths
data:
  simulated_genomes: "data/simulated_draft_genomes"
  contigs_dir: "data/simulated_draft_genomes/contigs"
  gaps_dir: "data/simulated_draft_genomes/gaps" 
  test_sequences: "data/test_sequences"
  results_dir: "results"

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "genomio.log"

# Environment Configuration
environment:
  device: "auto"  # "cpu", "cuda", or "auto"
  cache_dir: ".cache"
  random_seed: 42